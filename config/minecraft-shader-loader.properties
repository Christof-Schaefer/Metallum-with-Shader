# Only the bundled pack is supported; see README.
pack=MakeUp-UltraFast-Metallum-with-Shader.zip

# --- Loader optimizations (false = off; restart required) ---
# Shadow map: only re-render terrain when the sun, camera grid cell or chunks change
minecraftShaders.shadowCache=true
# Sun angle step in degrees that triggers a shadow map rebuild
minecraftShaders.shadowCacheAngle=0.25
# Forced full rebuild after N frames (e.g. for waving leaves)
minecraftShaders.shadowCacheMaxAge=120
# Spread a shadow map rebuild over N frames (avoids stutter)
minecraftShaders.shadowCacheSlices=8
# Internal render resolution of the shader pack (1 = native)
minecraftShaders.renderScale=0.8
# Let Metal track GPU dependencies instead of a global fence chain
metallum.trackedHazards=true
minecraftShaders.hardwareShadowComparison=true
minecraftShaders.lazyTargetClears=true
minecraftShaders.skipUnusedMipmaps=true
minecraftShaders.shadowReceiverCulling=false
minecraftShaders.optimizeFragmentSpirv=true
minecraftShaders.optimizeVertexSpirv=true

# Per-pass GPU timing -> logs/shader-profile.jsonl
minecraftShaders.profiler.enabled=false
